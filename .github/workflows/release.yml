name: Release (TestFlight)

# Mrasem iOS — signed archive + optional TestFlight upload.
#
# Manual only (Actions → Release (TestFlight) → Run workflow). Needs these
# repository secrets (Settings → Secrets and variables → Actions); see
# docs/mrasem/07-RELEASE.md for how to produce each one:
#
#   BUILD_CERTIFICATE_BASE64      Apple Distribution certificate (.p12), base64
#   P12_PASSWORD                  password of that .p12
#   BUILD_PROVISION_PROFILE_BASE64  App Store provisioning profile, base64
#   KEYCHAIN_PASSWORD             any random string (temporary keychain)
#   APPSTORE_API_KEY_ID           App Store Connect API key id
#   APPSTORE_ISSUER_ID            App Store Connect issuer id
#   APPSTORE_API_PRIVATE_KEY      contents of AuthKey_<id>.p8
#
# The bundle id and team come from the project (no pbxproj edits, rule A).

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight (otherwise only build the .ipa)"
        type: boolean
        default: false

jobs:
  archive:
    name: Archive
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        env:
          CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT" ] || [ -z "$PROFILE" ]; then
            echo "::error::Signing secrets are missing. See docs/mrasem/07-RELEASE.md."
            exit 1
          fi

      - name: Install certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/dist.p12
          PP_PATH=$RUNNER_TEMP/mrasem.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          # Read the profile's name/team/bundle so nothing is hard-coded here.
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$RUNNER_TEMP/profile.plist")
          BUNDLE=${APPID#*.}
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          echo "PROFILE_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
          echo "Profile: $NAME · team $TEAM · bundle $BUNDLE"

      - name: Check bundle id matches the project
        run: |
          PROJECT_BUNDLE=$(xcodebuild -showBuildSettings \
            -project WantProcuration.xcodeproj -scheme WantProcuration -configuration Release \
            | awk -F' = ' '/ PRODUCT_BUNDLE_IDENTIFIER /{print $2; exit}')
          echo "Project bundle: $PROJECT_BUNDLE"
          if [ "$PROJECT_BUNDLE" != "$PROFILE_BUNDLE" ]; then
            echo "::error::Profile is for $PROFILE_BUNDLE but the project builds $PROJECT_BUNDLE."
            exit 1
          fi
          echo "BUNDLE_ID=$PROJECT_BUNDLE" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          mkdir -p .build
          xcodebuild archive \
            -project WantProcuration.xcodeproj \
            -scheme WantProcuration \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath .build/Mrasem.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            2>&1 | tee .build/archive.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            grep -E "error:" .build/archive.log | sort -u | head -20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $status

      - name: Write App Store Connect key
        env:
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          echo "$KEY" > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Export (and upload)
        env:
          UPLOAD: ${{ inputs.upload }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          DESTINATION=export
          [ "$UPLOAD" = "true" ] && DESTINATION=upload
          cat > .build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>${DESTINATION}</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath .build/Mrasem.xcarchive \
            -exportOptionsPlist .build/ExportOptions.plist \
            -exportPath .build/export \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee .build/export.log

      - name: Keep the .ipa
        if: ${{ !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: Mrasem-${{ github.run_number }}
          path: .build/export/*.ipa
          retention-days: 14

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/dist.p12"
